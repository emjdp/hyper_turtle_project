name: Deploy presentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/extracted_images
          cp index.html _site/index.html
          cp -a docs _site/docs
          cp "extracted_images/20260531_230324_github_23s.gif" _site/extracted_images/
          cp "extracted_images/3데처 stereo matching 배운대로.png" _site/extracted_images/
          cp "extracted_images/C920_photo_map_overlay.jpeg" _site/extracted_images/
          cp "extracted_images/LiDAR_floorplan_primary_결과.jpeg" _site/extracted_images/
          cp "extracted_images/LiDAR_true_3D_scene.jpeg" _site/extracted_images/
          cp "extracted_images/Multi_node_stitched_tour.jpeg" _site/extracted_images/
          cp "extracted_images/turtle-20260520-20.jpg" _site/extracted_images/
          cp "extracted_images/기존_ICP_merge_결과.jpeg" _site/extracted_images/
          cp "extracted_images/기존_output_top_down_진단.jpeg" _site/extracted_images/
          cp "extracted_images/최종_Edge_textured_3D_map_desktop.jpeg" _site/extracted_images/
          cp "extracted_images/최종_Edge_textured_3D_map_mobile.jpeg" _site/extracted_images/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
