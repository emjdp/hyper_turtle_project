teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 7  # Enable button on Xbox Series X Controller over Bluetooth
    enable_turbo_button: 4  # LB button on Xbox controller
    
    axis_linear:
      x: 1  # Left stick vertical
    axis_angular:
      yaw: 3  # Right stick horizontal
      
    scale_linear:
      x: 0.15
    scale_linear_turbo:
      x: 0.22
      
    scale_angular:
      yaw: 0.8
    scale_angular_turbo:
      yaw: 1.2
